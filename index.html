<style>
/* Layout: one felt table with six seats on an oval rail; your hand and controls docked beneath it. Single dark card-room look. */
:root{
  --bg:#0b1d19; --panel:#12302a; --panel-2:#183a33; --line:#2b5549;
  --felt:#11493d; --felt-hi:#1b6152; --rail:#2a1c13; --rail-hi:#4a3322;
  --ink:#f2ead8; --muted:#9fb5aa; --faint:#6f8c80;
  --brass:#dcaa4f; --brass-ink:#22180a;
  --card:#fbf6ea; --card-ink:#1c1c1c; --red:#c3312c; --back-1:#7c2a23; --back-2:#93392f;
  --ok:#6cc08a; --warn:#e2b34f; --danger:#d0574a;
  --f-display:"Do Hyeon","Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
html[data-lang="en"]{--f-display:"Avenir Next","Segoe UI",system-ui,sans-serif;--f-body:"Avenir Next","Segoe UI",system-ui,sans-serif;--f-num:"SF Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
html[data-lang="zh"]{--f-display:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;--f-body:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;--f-num:"SF Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:12px 28px}
button{font:inherit;color:inherit;cursor:pointer}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .12s ease,filter .12s ease,opacity .12s ease,background-color .15s ease}
button:not(:disabled):active,button.pressed{transform:scale(.94);filter:brightness(.78)}
@media (hover:hover){button:not(:disabled):hover{filter:brightness(1.12)}}
button:disabled{cursor:not-allowed}
.card[data-a]:active,.seat[data-a]:active,[data-a].empty:active{filter:brightness(.8)}
button.copied{background:var(--ok)!important;color:#fff!important;border-color:transparent!important}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:620px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar h1{display:flex;align-items:center;gap:8px;white-space:nowrap;font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;letter-spacing:.01em;flex:1;min-width:0}
.bar .brand-home{display:block;flex:none;width:min(100%,230px);height:56px;line-height:0}
.bar .brand-logo{display:block;width:100%;height:100%;object-fit:contain;object-position:left center}
.bar h1 small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:8px;letter-spacing:.04em}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink)}
.ghost:hover{border-color:var(--brass)}

/* lobby */
.hero{padding-block:18px 6px}
.hero h2{font-family:var(--f-display);font-weight:400;font-size:44px;line-height:1.05;margin:0 0 8px;text-wrap:balance}
.hero p{color:var(--muted);margin:0;max-width:52ch}
.suits{font-size:20px;letter-spacing:.3em;color:var(--brass);margin-bottom:6px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.mode h3{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
.mode p{margin:0;color:var(--muted);font-size:14px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);font-size:18px}
.stepper .num{font-size:20px;min-width:2ch;text-align:center}
.primary{background:var(--brass);color:var(--brass-ink);border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.code-in{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);font-family:var(--f-num);font-size:17px;letter-spacing:.2em;text-transform:uppercase}
.note{font-size:13px;color:var(--faint);margin:0}
.note.warn{color:var(--warn)}

/* table */
.table{position:relative;width:100%;aspect-ratio:10/12.5;max-width:560px;margin-inline:auto}
.table.wide{aspect-ratio:16/9;max-width:none}
.felt{position:absolute;inset:26% 2.5% 26% 2.5%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,var(--felt-hi),var(--felt) 70%);
  box-shadow:0 0 0 9px var(--rail),0 0 0 11px var(--rail-hi),inset 0 0 40px rgba(0,0,0,.35)}
.felt::after{content:"";position:absolute;inset:9%;border-radius:50%;border:1px solid rgba(242,234,216,.08)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;width:56%}
.table.wide .felt{inset:14% 7%}
.table.wide .center{width:46%;gap:8px}
.board{display:flex;gap:3px;--cw:min(54px,calc((min(100vw - 32px,560px) * .55 - 12px) / 5))}
.table.wide .board{--cw:clamp(56px,4.8vw,88px);gap:6px}
.pot{display:flex;flex-direction:column;align-items:center;gap:3px;--sz:19px}
.pot .amt{font-size:13px;color:var(--ink);background:rgba(0,0,0,.32);padding:1px 12px;border-radius:999px}
.table.wide .pot{--sz:clamp(24px,2vw,32px)}
.table.wide .pot .amt{font-size:15px}
.pot b{color:var(--brass);font-weight:600}
.result{font-size:12px;line-height:1.35;text-align:center;color:var(--brass);min-height:1.4em;text-wrap:balance}
.stage{font-size:11px;letter-spacing:.14em;color:var(--muted)}

.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px}
.seat .hole{display:flex;gap:2px;--cw:25px;height:34px}
.table.wide .seat .hole{--cw:clamp(36px,3vw,50px);height:calc(var(--cw)*1.34)}
.table.wide .plate{padding:6px 8px;border-radius:12px}
.table.wide .plate .nm,.table.wide .plate .ch{font-size:clamp(13px,1vw,16px)}
.table.wide .plate .st{font-size:12px}
.table.wide .plate .ch .chip{--sz:14px}
.table.wide .stage{font-size:13px}
.table.wide .result{font-size:15px}
.table.wide .sit,.table.wide .emptyseat{font-size:13px;padding:10px 6px}
.plate{position:relative;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 6px;text-align:center;line-height:1.25}
.plate .nm{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .ch{display:block;font-size:12px;color:var(--brass)}
.plate .st{display:block;font-size:10px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat.acting .plate{border-color:var(--brass);box-shadow:0 0 0 2px rgba(220,170,79,.35)}
.seat.folded{opacity:.45}
.seat.out{opacity:.3}
.seat.win .plate{border-color:var(--ok);box-shadow:0 0 0 2px rgba(108,192,138,.35)}
.badge{position:absolute;top:-8px;right:-6px;min-width:20px;height:20px;border-radius:999px;background:var(--card);color:var(--card-ink);font-size:10px;font-weight:700;display:grid;place-items:center;padding-inline:4px;font-family:var(--f-num)}
.timer{height:3px;width:100%;background:rgba(0,0,0,.35);border-radius:2px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--brass);width:100%}
.betchip{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;--sz:15px;pointer-events:none}
.betchip .amt{font-size:10px;background:rgba(0,0,0,.45);color:var(--ink);border-radius:999px;padding:0 6px;white-space:nowrap}
.table.wide .betchip{--sz:clamp(18px,1.5vw,24px)}
.betchip.tight .stack{display:none}
.betchip.tight .amt{border:1px solid var(--brass)}
.table.wide .betchip .amt{font-size:12px}
.sit{background:rgba(0,0,0,.25);border:1px dashed var(--brass);border-radius:10px;padding:8px 6px;width:100%;font-size:12px;color:var(--brass)}
.emptyseat{border:1px dashed rgba(242,234,216,.12);border-radius:10px;padding:8px 6px;width:100%;font-size:11px;color:var(--faint);text-align:center}

/* cards */
.card{width:var(--cw);height:calc(var(--cw)*1.34);border-radius:2px;flex:none;position:relative;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.card svg{display:block;width:100%;height:100%}
.card .face-img{display:block;width:100%;height:100%;object-fit:fill;background:#fff;user-select:none;-webkit-user-drag:none;pointer-events:none}
.card.empty{box-shadow:none;border:1.5px dashed rgba(242,234,216,.16)}
.card.hl{box-shadow:0 0 0 2px var(--ok),0 2px 6px rgba(0,0,0,.45)}
.card.dim{opacity:.5}
.card.new{animation:deal .32s ease-out}
@keyframes deal{from{transform:translateY(-10px) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}

/* dock */
.dock{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.mine{display:flex;align-items:center;gap:14px}
.mine .hole{display:flex;gap:6px;--cw:58px}
.mine .info{display:flex;flex-direction:column;gap:2px;min-width:0}
.mine .hand{font-family:var(--f-display);font-size:22px;line-height:1.1}
.mine .sub{font-size:13px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.act{border-radius:12px;border:1px solid var(--line);background:var(--panel-2);padding:12px 6px;font-weight:700;font-size:15px;min-height:50px}
.act.fold{color:var(--danger)}
.act.call{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.act.raise{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.act:disabled{opacity:.35;cursor:not-allowed}
.raisebox{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.raisebox input[type=range]{width:100%;accent-color:var(--brass)}
.raisebox .raise-amount{display:flex;align-items:center;gap:8px}
.raisebox .raise-amount label{color:var(--muted);font-size:13px;white-space:nowrap}
.raisebox input[type=number]{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:9px 10px;font:600 16px var(--f-num)}
.lang-select{border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--ink);padding:8px 10px;font:600 13px var(--f-body);max-width:150px}
.language-picker{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.presets button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 2px;font-size:12px}
.status{text-align:center;color:var(--muted);font-size:14px;padding-block:6px}
.status b{color:var(--ink)}

/* log */
.log{list-style:none;margin:0;padding:0;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;max-height:120px;overflow:auto}
.log li b{color:var(--ink);font-weight:500}
.log li.sys{color:var(--faint)}
.tablecode{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tablecode .num{font-size:18px;color:var(--ink);letter-spacing:.18em;user-select:all}

/* rules sheet */
.sheet{position:fixed;inset:0;background:rgba(4,12,10,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.sheet .inner{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;max-width:620px;width:100%;max-height:88%;overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 4px}
.sheet h4{font-size:13px;letter-spacing:.08em;color:var(--brass);margin:18px 0 8px}
.rank{width:100%;border-collapse:collapse;font-size:13px}
.rank td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:middle}
.rank td:first-child{width:28px;color:var(--faint);font-family:var(--f-num)}
.rank .nm{font-weight:700;white-space:nowrap}
.rank .ex{display:flex;gap:2px;--cw:24px}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:12px;text-align:center}
.flow div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 2px}
.flow b{display:block;font-size:13px}
.flow span{color:var(--muted)}
.defs{width:100%;border-collapse:collapse;font-size:13px}
.defs th{text-align:left;font-weight:700;padding:7px 8px 7px 0;border-top:1px solid var(--line);white-space:nowrap;vertical-align:top}
.defs td{padding:7px 0;border-top:1px solid var(--line);color:var(--muted)}
.scroll{overflow-x:auto}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.over{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.over h3{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0}


.chat{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;gap:10px}
.chat-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chat-list{list-style:none;margin:0;padding:0;max-height:210px;min-height:64px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;font-size:14px}
.chat-list li{min-width:0;overflow-wrap:anywhere;line-height:1.45}
.chat-list .who{font-weight:700;margin-right:6px;color:var(--brass)}
.chat-list .mine .who{color:var(--ok)}
.chat-list .sys{color:var(--faint);font-size:13px}
.chat-form{display:flex;gap:6px;align-items:center}
.chat-form input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;font-size:16px}
.chat-form .primary{padding:10px 14px;flex:none}
.emoji-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-size:21px;flex:none;line-height:1}
.emoji-pad{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px}
.emoji-pad button{background:transparent;border:0;font-size:22px;padding:6px 0;border-radius:8px;line-height:1}
.emoji-pad button:hover{background:var(--panel-2)}
.bubble{--shift:0px;position:absolute;bottom:100%;left:50%;transform:translateX(calc(-50% + var(--shift)));margin-bottom:4px;background:var(--card);color:var(--card-ink);font-size:12px;line-height:1.4;padding:5px 10px;border-radius:12px;width:max-content;max-width:min(190px,56vw);white-space:normal;overflow-wrap:anywhere;word-break:keep-all;text-align:left;z-index:4;box-shadow:0 2px 6px rgba(0,0,0,.4);animation:pop .2s ease-out}
.bubble::after{content:"";position:absolute;left:calc(50% - var(--shift));top:100%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--card)}
.bubble.below{bottom:auto;top:100%;margin-bottom:0;margin-top:6px}
.bubble.below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--card)}
.table.wide .bubble{font-size:13px;max-width:260px}
@keyframes pop{from{transform:translateX(calc(-50% + var(--shift,0px))) scale(.85);opacity:0}to{transform:translateX(calc(-50% + var(--shift,0px)));opacity:1}}
@media (prefers-reduced-motion:reduce){.bubble{animation:none}}

.stepper button:disabled{opacity:.35;cursor:not-allowed}
.seatsize{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.seatsize>span:first-child{font-weight:700}
.table.dense .seat .hole{--cw:21px;height:30px}
.table.wide.dense .seat .hole{--cw:clamp(32px,2.7vw,44px);height:calc(var(--cw)*1.4)}
.table.dense .plate{padding:3px 4px}
.table.dense .plate .nm,.table.dense .plate .ch{font-size:11px}
.table.dense .plate .st{font-size:9px}
.table.dense:not(.wide) .board{--cw:min(50px,calc((min(100vw - 32px,560px) * .5 - 12px) / 5))}
.table.dense .sit,.table.dense .emptyseat{padding:6px 2px;font-size:10px}

.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.level{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);text-align:center;min-width:0}
.level b{font-family:var(--f-display);font-weight:400;font-size:17px}
.level span{font-size:11px;color:var(--muted);line-height:1.3}
.chips2{grid-template-columns:1fr 1fr}
.level.on{border-color:var(--brass);background:rgba(220,170,79,.14);box-shadow:inset 0 0 0 1px var(--brass)}

.chip{--sz:20px;position:relative;display:block;flex:none;width:var(--sz);height:var(--sz);border-radius:50%;
  background:radial-gradient(circle,var(--c) 0 56%,transparent 57%),repeating-conic-gradient(var(--c) 0 22.5deg,var(--e) 22.5deg 45deg);
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 1px 1px rgba(0,0,0,.45)}
.chip::after{content:"";position:absolute;inset:20%;border-radius:50%;border:1px dashed var(--e);opacity:.75}
.chip b{position:absolute;inset:0;display:grid;place-items:center;font:700 calc(var(--sz)*.32)/1 var(--f-num);color:var(--e);letter-spacing:-.03em}
.stack{display:inline-flex;gap:2px;align-items:flex-end}
.stack .col{position:relative;width:var(--sz);height:calc(var(--sz) + (var(--n) - 1) * var(--sz) * .16)}
.stack .chip{position:absolute;left:0;bottom:calc(var(--i) * var(--sz) * .16)}
.startchips{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center;margin-top:5px;--sz:18px}
.startchip{display:inline-flex;align-items:center;gap:3px;font:600 11px var(--f-num);color:var(--ink)}
.plate .ch{display:flex;align-items:center;justify-content:center;gap:3px}

/* 가로 화면: 테이블 왼쪽, 내 패·채팅 오른쪽 */
body.wide-table .shell{max-width:1440px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr) 360px;
  grid-template-areas:"bar bar" "note note" "table dock" "table chat" "table log";column-gap:24px;row-gap:12px;align-items:start}
body.wide-table #app{display:contents}

/* 내 자리 양옆: 왼쪽 이모티콘 줄, 오른쪽 내 칩 */
.table{--seatw:70px}
.table.dense{--seatw:62px}
.table.wide{--seatw:clamp(100px,8.4vw,140px)}

.table .seat{width:var(--seatw)}
.emostrip{position:absolute;top:90%;right:calc(50% + var(--seatw)/2 + 6px);transform:translateY(-50%);display:flex;gap:5px;
  max-width:calc(50% - var(--seatw)/2 - 8px);z-index:2}
.emostrip button{flex:1 1 0;min-width:0;width:clamp(26px,8vw,38px);aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:clamp(16px,5vw,23px);line-height:1;padding:0;display:grid;place-items:center}
.emostrip button:active{background:var(--panel-2)}
.emostrip .more{background:var(--panel-2);color:var(--ink);font:700 clamp(16px,4.8vw,21px)/1 var(--f-num)}
.emostrip .more.on{background:var(--brass);color:var(--brass-ink)}
.emo-all{position:absolute;left:2%;right:2%;bottom:17%;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:var(--bg);border:1px solid var(--brass);border-radius:14px;padding:6px;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.emo-all button{background:transparent;border:0;font-size:clamp(20px,6vw,26px);line-height:1;padding:6px 0;border-radius:8px}
.emo-all button:hover,.emo-all button:focus-visible{background:var(--panel-2)}
.table.wide .emo-all{left:auto;right:calc(50% + var(--seatw)/2 + 6px);width:min(440px,46%);bottom:16%}
.mytray{position:absolute;top:90%;left:calc(50% + var(--seatw)/2 + 8px);transform:translateY(-50%);display:flex;gap:5px;align-items:flex-end;
  max-width:calc(50% - var(--seatw)/2 - 10px);--sz:clamp(15px,4.6vw,22px);z-index:2}
.table.wide .mytray{--sz:clamp(20px,1.7vw,26px);gap:8px}
.tcol{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none}
.tcol .count{font-size:10.5px;color:var(--ink);line-height:1;background:rgba(0,0,0,.35);border-radius:999px;padding:1px 4px}
.bubble.emo{font-size:24px;padding:2px 8px;background:var(--card);line-height:1.2}
.table.wide .bubble.emo{font-size:32px}

/* 족보 용어 ⓘ 설명 창 (게임은 계속 진행) */
.dock{position:relative}
.mine .hand{display:flex;align-items:center;gap:8px}
.info-btn{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;color:var(--muted);
  font:italic 700 13px/1 Georgia,'Times New Roman',serif;display:grid;place-items:center;padding:0}
.info-btn:hover,.info-btn.on{border-color:var(--brass);color:var(--brass)}
.info-pop{position:absolute;left:10px;right:10px;bottom:calc(100% + 8px);z-index:8;background:var(--bg);border:1px solid var(--brass);border-radius:14px;
  padding:12px 14px;box-shadow:0 10px 28px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:8px;animation:infoin .15s ease-out}
@keyframes infoin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.info-pop p{margin:0;font-size:14px;line-height:1.55;color:var(--ink)}
.info-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.info-head b{font-family:var(--f-display);font-weight:400;font-size:20px}
.info-rank{font-size:12px;color:var(--brass)}
.info-x{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;padding:0 2px}
.info-ex{display:flex;gap:3px;--cw:30px}
body.wide-table .info-pop{bottom:auto;top:calc(100% + 8px)}

/* 이모티콘: 항상 컬러 이모티콘 글꼴로, 못 그리는 기기는 그림으로 */
.emo-t{font-family:"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji","Android Emoji","Twemoji Mozilla",sans-serif;font-style:normal;font-weight:400;line-height:1}
.emo-i{width:1.15em;height:1.15em;vertical-align:-.2em;display:inline-block}
button .emo-i,.bubble .emo-i{vertical-align:middle}

/* 이모티콘 줄 밑 작은 채팅 칸 */
.qchat{position:absolute;z-index:5;display:flex;align-items:center;gap:4px;height:30px}
.qchat[hidden]{display:none!important}
.qchat .qchat-open{flex:1;height:100%;display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--muted);font-size:12.5px;padding:0 10px}
.qchat input,.qchat .qchat-send{display:none}
.qchat.open .qchat-open{display:none}
.qchat.open input{display:block;flex:1;min-width:0;height:100%;border:1px solid var(--brass);border-radius:999px;background:var(--bg);color:var(--ink);font:16px var(--f-body);padding:0 10px}
.qchat.open .qchat-send{display:grid;place-items:center;flex:none;width:30px;height:30px;border:0;border-radius:50%;background:var(--brass);color:var(--brass-ink);font:700 16px/1 var(--f-num)}

/* 내 족보 순위 사다리와 확률 */
.hrank{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.ladder{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;max-width:260px}
.ladder i{font-style:normal;font-size:11px;font-family:var(--f-num);line-height:1;text-align:center;padding:4px 0;border-radius:4px;background:rgba(255,255,255,.06);color:var(--faint);white-space:nowrap;overflow:hidden}
.ladder i.up{background:rgba(255,255,255,.04)}
.ladder i.on{background:var(--brass);color:var(--brass-ink);font-weight:700}
.hr-txt{font-size:12px;color:var(--muted)}
.hr-txt b{color:var(--ink);font-weight:600}
.info-prob{font-size:13px!important;color:var(--muted)!important}
.info-prob b{color:var(--brass)}
.rank .prob{font-size:12px;color:var(--muted)}
.rank .prob b{color:var(--brass);font-weight:600}

/* 추천플레이 */
.result{border:1px solid var(--brass);border-radius:12px;background:var(--bg);padding:10px 10px 8px}
.res-title{font-weight:700;font-size:14px;color:var(--brass);margin-bottom:6px}
.res-table{width:100%;border-collapse:collapse;font-size:13px}
.res-table th{white-space:nowrap;font-size:11px;font-weight:500;color:var(--muted);text-align:left;padding:0 4px 4px;border-bottom:1px solid var(--line)}
.res-table td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.res-table tr:last-child td{border-bottom:0}
.res-table tr.w td{background:rgba(212,175,55,.10)}
.res-table tr.f td{opacity:.6}
.res-table tr.me .res-nm{font-weight:700}
.res-nm{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-nm small{color:var(--muted);font-weight:400}
.res-cards{white-space:nowrap;--cw:26px;width:60px}
.res-cards .card{display:inline-block;margin-right:3px;vertical-align:middle}
.res-hn{font-size:12px;word-break:keep-all}
body.wide-table .res-cards{--cw:30px;width:68px}
.res-out{text-align:right;white-space:nowrap}
.res-win{color:var(--brass)}
.res-lose{color:var(--muted)}
.res-fold{color:var(--muted);font-size:12px}
.res-note{margin:6px 0 0;font-size:11px;color:var(--muted)}
.huse{font-size:12px;line-height:1.35;word-break:keep-all;color:var(--ink);margin:2px 0}
.huse b{font-size:11px;font-weight:700;color:var(--bg);background:var(--brass);border-radius:4px;padding:0 5px;margin-right:4px}
.hand-board{font-style:normal;font-family:var(--f-body,inherit);font-size:13px;font-weight:700;color:var(--bg);background:#8fa3a0;border-radius:5px;padding:1px 6px;vertical-align:middle}
.huse.shared{color:var(--muted)}
.huse .ct{font-weight:700;color:var(--ink)}
.huse .ct.red{color:#e5534b}
.res-board{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 3px}
.advice{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.adv-toggle{width:100%;display:flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--ink);font-weight:700;font-size:14px;padding:10px 12px;text-align:left}
.adv-toggle .adv-street{font-weight:500;font-size:12px;color:var(--brass);border:1px solid var(--brass);border-radius:999px;padding:0 7px}
.adv-toggle .adv-caret{margin-left:auto;color:var(--muted)}
.adv-body{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}
.adv-rec{display:flex;align-items:baseline;gap:8px}
.adv-rec .adv-label{font-size:12px;color:var(--muted)}
.adv-rec b{font-family:var(--f-display);font-weight:400;font-size:22px}
.adv-rec.bet b{color:var(--brass)}
.adv-rec.call b,.adv-rec.check b{color:var(--ink)}
.adv-rec.fold b{color:var(--danger)}
.adv-why{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink)}
.adv-bar{position:relative;height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:visible}
.adv-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--ok),#9be0b2)}
.adv-bar em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--danger);transform:translateX(-1px)}
.adv-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.adv-legend b{color:var(--ink)}
.adv-legend em{display:inline-block;width:2px;height:10px;background:var(--danger);margin-right:5px;vertical-align:-1px}
.adv-row{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.adv-row b{color:var(--ink);font-weight:600}
.adv-sub{font-size:11px;color:var(--faint)}
.adv-note{margin:0;font-size:11px;color:var(--faint)}
@media (max-width:420px){
  .mine .hole{--cw:50px}
  .hero h2{font-size:38px}
  .bar{gap:6px}
  .bar h1{font-size:22px}
  .bar .brand-home{width:min(42vw,190px);height:46px}
  .bar h1 small{display:none}
  .bar .ghost{padding:6px 10px;font-size:12px}
}

/* ---- 액션 배지 (폴드/체크/콜/레이즈) ---- */
.act-badge{position:absolute;left:50%;top:50%;z-index:6;pointer-events:none;white-space:nowrap;
  font:800 14px/1 var(--f-body);letter-spacing:.02em;padding:7px 13px;border-radius:999px;color:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25);
  animation:actpop 2.2s cubic-bezier(.2,.8,.3,1) both}
.table.wide .act-badge{font-size:17px;padding:9px 16px}

.act-badge.check{background:#2f7fd1}
.act-badge.call{background:#1f9d62}
.act-badge.raise{background:#e08a1e}

@keyframes actpop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  12%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}
  22%{transform:translate(-50%,-50%) scale(1)}
  70%{opacity:1;transform:translate(-50%,-62%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-95%) scale(.96)}}
.seat.folded-now .plate{animation:folddim .5s ease-out}
@keyframes folddim{from{filter:brightness(1.6)}to{filter:none}}

/* ---- 카드 뒤집기 ---- */
.board,.hole{perspective:600px}
.card.flip{transform-style:preserve-3d;-webkit-transform-style:preserve-3d;animation:cardflip .75s cubic-bezier(.3,.7,.25,1) both}
.card.flip > *{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card.flip > .flipback{position:absolute;inset:0;border-radius:inherit;overflow:hidden;transform:rotateY(180deg)}
.card.flip > .flipback svg{width:100%;height:100%;display:block}
@keyframes cardflip{
  0%{opacity:0;transform:translateY(-22px) rotateY(180deg) scale(.9)}
  28%{opacity:1;transform:translateY(0) rotateY(180deg) scale(1)}
  62%{transform:rotateY(80deg) scale(1.1);box-shadow:0 10px 18px rgba(0,0,0,.5)}
  100%{transform:rotateY(0) scale(1)}}
.card.flip::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;
  animation:shine .75s ease-out both;animation-delay:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden}
@keyframes shine{0%,60%{background-position:120% 0;opacity:1}100%{background-position:-60% 0;opacity:0}}

  const g = Object.entries(cnt).map(([k,n])=>[+k,n]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
  let cat, ks;
  if (sh && flush){ cat=8; ks=[sh]; }

  else if (g[0][1]===3 && g[1][1]===2){ cat=6; ks=[g[0][0],g[1][0]]; }

    commit(p, to - p.bet);
    const size = to - s.currentBet;
    if (size >= s.minRaise){
      s.minRaise = size;
      s.seats.forEach((q,j)=>{ if (q && j!==i && q.inHand && !q.folded && !q.allin){ q.acted=false; q.canRaise=true; } });
    } else {
      // 최소 레이즈에 못 미치는 올인: 이미 액션한 사람은 콜/폴드만 가능
      s.seats.forEach((q,j)=>{ if (q && j!==i && q.inHand && !q.folded && !q.allin){ if (q.acted) q.canRaise=false; q.acted=false; } });
    }
    s.currentBet = to; p.r = (p.r||0)+1;
    logIt(s,i, p.allin ? `올인 ${fmt(to)}` : `${word} ${fmt(to)}`);
  } else return null;
  p.acted = true;
  advance(s, i, now);
  return s;
}

function returnUncalled(s){
  const live = idxs(s, p=>p.inHand);
  const sorted = live.map(i=>s.seats[i].bet).sort((a,b)=>b-a);
  if (sorted.length<2 || sorted[0]===sorted[1]) return;
  const top = live.find(i=>s.seats[i].bet===sorted[0]); const p = s.seats[top]; const d = sorted[0]-sorted[1];
  p.bet-=d; p.total-=d; p.chips+=d; if (p.chips>0) p.allin=false;
}

function dealStreet(s){
  s.deck.pop(); // 번 카드
  const draw = ()=>{ (s.boardIdx = s.boardIdx || []).push(s.deck.length-1); return s.deck.pop(); };
  if (s.stage==='preflop'){ s.board.push(draw(), draw(), draw()); s.stage='flop'; }
  else if (s.stage==='flop'){ s.board.push(draw()); s.stage='turn'; }
  else if (s.stage==='turn'){ s.board.push(draw()); s.stage='river'; }
}

function advance(s, from, now){
  const S = s.seats;
  const alive = idxs(s, p=>p.inHand && !p.folded);
  if (alive.length===1){ returnUncalled(s); finishUncontested(s, alive[0], now); return; }
  const canAct = alive.filter(i=>!S[i].allin);
  const pending = canAct.filter(i=>!S[i].acted || S[i].bet < s.currentBet);
  const done = pending.length===0 || (canAct.length===1 && S[canAct[0]].bet >= s.currentBet);
  if (!done){ s.toAct = nextIdx(s, from, (p,i)=>pending.includes(i)); s.turnDeadline = now + TURN_MS; return; }
  returnUncalled(s);
  S.forEach(p=>{ if (p){ p.bet=0; p.acted=false; p.canRaise=true; p.r=0; } });
  s.currentBet = 0; s.minRaise = s.bb || BB;
  if (s.stage==='river'){ showdown(s, now); return; }
  dealStreet(s);
  const actors = alive.filter(i=>!S[i].allin);
  if (actors.length<=1){ while (s.stage!=='river') dealStreet(s); showdown(s, now); return; }
  s.toAct = nextIdx(s, s.dealer, p=>p.inHand && !p.folded && !p.allin);
  s.turnDeadline = now + TURN_MS;
}

function finishUncontested(s, w, now){
  const amt = potSize(s); s.seats[w].chips += amt;
  s.winners = [{s:w, amt, h:''}]; s.uncontested = true;
  logIt(s, w, `${fmt(amt)} 획득 (모두 폴드)`);
  endHand(s, now);
}

function showdown(s, now){
  const S = s.seats;
  const alive = idxs(s, p=>p.inHand && !p.folded);
  const ev = {}; alive.forEach(i=>{ ev[i] = best(S[i].cards.concat(s.board)); S[i].shown = true; S[i].hn = handName(ev[i]); });
  const contrib = idxs(s, p=>p.inHand);
  const levels = [...new Set(alive.map(i=>S[i].total))].sort((a,b)=>a-b);
  const pots = []; let prev = 0;
  levels.forEach((L,k)=>{
    let amt = 0; contrib.forEach(i=>{ amt += Math.min(S[i].total, L) - Math.min(S[i].total, prev); });
    if (k===levels.length-1) contrib.forEach(i=>{ amt += Math.max(0, S[i].total - L); }); // 폴드한 사람의 초과분
    pots.push({amt, el: alive.filter(i=>S[i].total>=L)}); prev = L;
  });
  const won = {};
  pots.forEach(pt=>{
    if (!pt.amt) return;
    const top = Math.max(...pt.el.map(i=>ev[i].score));
    const ws = pt.el.filter(i=>ev[i].score===top);
    // 남는 칩은 딜러 왼쪽부터
    const N = s.seats.length; ws.sort((a,b)=>((a-s.dealer+N-1)%N)-((b-s.dealer+N-1)%N));
    const share = Math.floor(pt.amt/ws.length); let rem = pt.amt - share*ws.length;
    ws.forEach(i=>{ const g = share + (rem>0?1:0); if (rem>0) rem--; won[i]=(won[i]||0)+g; });
  });
  s.winners = Object.entries(won).map(([i,amt])=>({s:+i, amt, h:handName(ev[i])}));
  s.winners.forEach(w=>{ S[w.s].chips += w.amt; logIt(s, w.s, `${fmt(w.amt)} 획득 · ${w.h}`); });
  s.uncontested = false;
  endHand(s, now);
}
function endHand(s, now){
  s.stage='done'; s.toAct=-1; s.currentBet=0; s.nextHandAt = now + NEXT_MS;
  // 족보 이름만 계산해 둠. 공개(shown)는 쇼다운까지 간 사람만 — 폴드한 사람은 원할 때 '내 카드 보여주기'
  s.seats.forEach(p=>{
    if (!p) return; p.bet=0;
    if (!p.inHand || p.cards.length<2) return;
    if (s.board.length>=3){ const b = best(p.cards.concat(s.board)); p.hn = handName(b); p.sc = b.score; }
    else { p.hn = p.cards[0][0]===p.cards[1][0] ? '포켓 페어' : '하이카드'; p.sc = 0; }
  });
}

// 판이 끝난 뒤 본인이 원할 때만 카드 공개
function showCards(s, i){
  if (s.stage!=='done' || i<0) return null;
  const p = s.seats[i];
  if (!p || !p.inHand || !p.cards || p.cards.length<2 || p.shown) return null;
  const n = clone(s); n.seats[i].shown = true; logIt(n, i, '카드 공개'); return n;
}

/* ================= 컴퓨터 플레이어 ================= */
function equity(hole, board, nOpp, iters){
  const used = new Set(hole.concat(board)); const rest = FULL.filter(c=>!used.has(c));
  const need = 5 - board.length; let w = 0;
  for (let t=0;t<iters;t++){
    const n = need + 2*nOpp;
    for (let k=0;k<n;k++){ const j = k + Math.floor(Math.random()*(rest.length-k)); [rest[k],rest[j]]=[rest[j],rest[k]]; }
    const b = board.concat(rest.slice(0,need));
    const me = best(hole.concat(b)).score; let top = 0;
    for (let o=0;o<nOpp;o++){ const sc = best([rest[need+2*o],rest[need+2*o+1]].concat(b)).score; if (sc>top) top=sc; }
    if (me>top) w+=1; else if (me===top) w+=0.5;
  }
  return w/iters;
}
// 난이도: easy(쉬움) / normal(보통) / hard(어려움)
function botDecide(s, i){
  const BB = s.bb || 20;   // 이 테이블의 빅 블라인드
  const level = s.level || 'normal';
  const p = s.seats[i], L = legal(s,i), per = p.per || {agg:.5, loose:.03};
  const alive = idxs(s,q=>q.inHand && !q.folded);
  const nOpp = Math.max(1, alive.length - 1);
  const pot = potSize(s);
  const r = Math.random();
  const round10 = v => Math.round(v/10)*10;
  const raiseTo = to => ({type:'raise', to: round10(to)});
  let odds = L.callAmt>0 ? L.callAmt/(pot+L.callAmt) : 0;

  if (level==='easy'){
    // 계산을 대충 하고, 자주 따라가며, 작게 베팅하고, 블러핑하지 않음
    let eq = equity(p.cards, s.board, nOpp, 70) + (Math.random()-.5)*.24;
    const rel = eq*(nOpp+1);
    if (L.canRaise && (p.r||0) < 1 && rel > 2.0 && r < .55)
      return raiseTo(s.currentBet + Math.max(BB, (pot+L.callAmt)*(.25+Math.random()*.25)));
    if (L.canCheck) return {type:'check'};
    const bigBet = L.callAmt > (p.chips+p.bet)*.45;
    if (bigBet && eq < .45 && r < .7) return {type:'fold'};
    if (eq + .18 >= odds*.8) return {type:'call'};
    return r < .25 ? {type:'call'} : {type:'fold'};
  }

  if (level==='hard'){
    // 계산을 많이 하고, 포지션·팟 오즈·상대의 큰 베팅을 반영
    let eq = equity(p.cards, s.board, nOpp, s.board.length ? 520 : 420);
    const facing = L.callAmt>0 ? L.callAmt/Math.max(BB, pot) : 0;
    eq = Math.max(0, eq - Math.min(.22, facing*.12));          // 크게 베팅받으면 상대 패를 강하게 봄
    const rel = eq*(nOpp+1);
    const order = (i - s.dealer + s.seats.length) % s.seats.length;
    const late = i===s.dealer || order===0 || alive.length<=3;  // 늦은 포지션
    const stack = p.chips + p.bet;
    if (s.stage==='preflop'){
      const openT = late ? 1.25 : 1.45;
      if (L.canRaise && (p.r||0) < 2 && rel > (s.currentBet>BB ? 1.75 : openT)){
        const base = s.currentBet>BB ? s.currentBet*3 : BB*(late?2.5:3);
        if (rel > 2.3 && r < .3) return raiseTo(L.maxTo);
        return raiseTo(Math.max(L.minTo, base));
      }
      if (L.canCheck) return {type:'check'};
      if (L.callAmt <= BB && rel > .9) return {type:'call'};
      if (eq >= odds*.85 && rel > 1.05) return {type:'call'};
      return {type:'fold'};
    }
    if (L.canRaise && (p.r||0) < 2){
      if (rel > 1.55 && eq > .5){
        const size = (pot+L.callAmt)*(.6+Math.random()*.35);
        if (eq > .82 && (stack < pot*1.5 || r < .25)) return raiseTo(L.maxTo);
        return raiseTo(s.currentBet + Math.max(BB, size));
      }
      // 블러핑·세미블러핑 (상대가 적을 때, 체크로 넘어왔을 때)
      if (L.canCheck && nOpp<=2 && ((s.stage==='flop' && eq>.32 && r<.3) || (s.stage!=='flop' && r < .14 + per.agg*.08)))
        return raiseTo(s.currentBet + Math.max(BB, pot*(.5+Math.random()*.25)));
    }
    if (L.canCheck) return {type:'check'};
    if (L.callAmt >= p.chips && eq < .55 && rel < 1.6) return {type:'fold'};
    if (eq >= odds + .02) return {type:'call'};
    return {type:'fold'};
  }

  // 보통
  const eq = equity(p.cards, s.board, nOpp, s.board.length ? 260 : 200);
  const rel = eq*(nOpp+1);
  if (s.stage==='preflop') odds *= .7;
  if (L.canRaise && (p.r||0) < 2){
    const value = rel > 1.75 - per.agg*.45 && eq > .3;
    const bluff = L.canCheck && s.stage!=='preflop' && r < .05 + per.agg*.07;
    if (value || bluff){
      if (eq > .8 && r < .35) return raiseTo(L.maxTo);
      return raiseTo(s.currentBet + Math.max(BB, (pot + L.callAmt) * (.45 + Math.random()*.55)));
    }
  }
  if (L.canCheck) return {type:'check'};
  if (eq + per.loose >= odds) return {type:'call'};
  if (L.callAmt <= BB && eq > .12) return {type:'call'};
  return {type:'fold'};
}

function handUse(hole, board){
  if (!hole || hole.length<2 || board.length<3) return null;
  const b = best(hole.concat(board)); if (!b) return null;
  const five = b.cards, cnt = {};
  five.forEach(c=>{ cnt[c[0]] = (cnt[c[0]]||0) + 1; });
  let core;
  if ([1,2,3,6,7].includes(b.cat)) core = five.filter(c=>cnt[c[0]]>=2);       // 페어·트리플·풀하우스·포카드: 짝 맞은 카드
  else if (b.cat===0) core = [five.slice().sort((x,y)=>rv(y)-rv(x))[0]];       // 하이카드: 제일 높은 카드
  else core = five;                                                           // 스트레이트·플러시: 5장 모두
  let mineCore = hole.filter(c=>core.includes(c));
  let kick = hole.filter(c=>five.includes(c) && !core.includes(c));
  if (board.length===5){ const bb = best(board); if (bb && bb.score===b.score){ mineCore = []; kick = []; } } // 바닥 5장 그대로가 최고
  return {b, name: handName(b), mineCore, kick, shared: mineCore.length===0};
}

/* ---------- 이모티콘 호환 ----------
   보낼 때는 이모티콘 글자 그대로 보내고, 받는 기기에서 그 기기 이모티콘으로 그림.
   그 기기가 못 그리는 이모티콘(□로 깨지거나 쪼개짐)은 같은 이모티콘 그림(Twemoji)으로,
   그림도 못 불러오면 비슷한 옛날 이모티콘으로 대신 보여줌. */
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji","Android Emoji","Twemoji Mozilla",sans-serif';
const EMOJI_FALLBACK = {'🫵':'👉','😵‍💫':'😵','🪓':'🔨','🤲':'🙌','🤯':'😱','🤬':'😡','🤪':'😜','☠️':'💀','🖐️':'✋','🤝':'👍','💩':'😝','👺':'😈','🃏':'🎴'};
const emojiOkCache = new Map();
let emojiProbe = null;
function emojiPixels(ch){
  const {x} = emojiProbe; x.clearRect(0, 0, 40, 40); x.fillText(ch, 4, 4);
  return x.getImageData(0, 0, 40, 40).data;
}
function emojiSupported(e){
  if (emojiOkCache.has(e)) return emojiOkCache.get(e);
  let ok = true;
  try {
    if (!emojiProbe){
      const c = document.createElement('canvas'); c.width = c.height = 40;
      const x = c.getContext('2d', {willReadFrequently:true});
      x.font = `28px ${EMOJI_FONT}`; x.textBaseline = 'top'; x.fillStyle = '#000';
      emojiProbe = {x, tofu: null, one: x.measureText('😀').width};
      emojiProbe.tofu = emojiPixels('\u{10FFFD}');          // 이 기기가 "없는 글자"를 그리는 모양(□)
    }
    const {x, tofu, one} = emojiProbe;
    if (x.measureText(e).width > one * 1.35) ok = false;   // 합성 이모티콘이 여러 개로 쪼개져 그려짐
    else {
      const d = emojiPixels(e); let ink = 0, same = true;
      for (let i = 3; i < d.length; i += 4){ if (d[i] > 40) ink++; if (same && d[i] !== tofu[i]) same = false; }
      ok = ink > 20 && !same;                               // 아무것도 안 그려지거나 □와 똑같으면 미지원
    }
  } catch(_){ ok = true; }
  emojiOkCache.set(e, ok); return ok;
}
function twemojiURL(e){
  const cps = [...e].map(ch=>ch.codePointAt(0));
  const list = cps.includes(0x200d) ? cps : cps.filter(cp=>cp!==0xfe0f);
  return `https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/${list.map(cp=>cp.toString(16)).join('-')}.svg`;
}
// HTML 문자열로 (우리 목록에 있는 이모티콘 전용)
function emojiHTML(e){
  if (emojiSupported(e)) return `<span class="emo-t">${e}</span>`;
  const fb = EMOJI_FALLBACK[e] || e;
  return `<img class="emo-i" src="${twemojiURL(e)}" alt="${e}" draggable="false" onerror="this.outerHTML='<span class=&quot;emo-t&quot;>${fb}</span>'">`;
}
// 아무 글(채팅·말풍선)을 안전하게 그리면서 이모티콘만 골라 호환 처리
const isEmojiGrapheme = g => /\p{Extended_Pictographic}|\p{Regional_Indicator}/u.test(g) || /^[‼⁉♠-♧]️$/.test(g);
function graphemes(str){
  if (window.Intl && Intl.Segmenter) return [...new Intl.Segmenter('ko', {granularity:'grapheme'}).segment(str)].map(x=>x.segment);
  return str.match(/\p{Extended_Pictographic}️?(?:‍\p{Extended_Pictographic}️?)*|[\s\S]/gu) || [];
}
function renderRich(el, text){
  el.textContent = '';
  let buf = '';
  const flush = () => { if (buf){ el.appendChild(document.createTextNode(buf)); buf = ''; } };
  for (const g of graphemes(String(text||''))){
    if (!isEmojiGrapheme(g)){ buf += g; continue; }
    flush();
    if (emojiSupported(g)){ const sp = document.createElement('span'); sp.className = 'emo-t'; sp.textContent = g; el.appendChild(sp); }
    else {
      const img = document.createElement('img'); img.className = 'emo-i'; img.alt = g; img.draggable = false; img.src = twemojiURL(g);
      img.onerror = () => { const sp = document.createElement('span'); sp.className = 'emo-t'; sp.textContent = EMOJI_FALLBACK[g] || g; img.replaceWith(sp); };
      el.appendChild(img);
    }
  }
  flush();
}

function cardHTML(c, opts={}){
  if (!c) return `<div class="card empty"></div>`;
  if (c==='back') return `<div class="card back">${BACK_SVG}</div>`;
  const key = (opts.key||'') + c;
  const fresh = opts.animate && !ui.seenCards.has(key); if (opts.animate) ui.seenCards.add(key);
  const label = `${RANK_TXT(c[0])} ${({s:'스페이드',h:'하트',d:'다이아',c:'클로버'})[c[1]]}`;
  const cls = `card face-card${opts.hl?' hl':''}${opts.dim?' dim':''}${fresh?' new':''}`;
  if (opts.flipAt){
    const el = Date.now() - opts.flipAt;
    if (el < 800){
      opts = Object.assign({}, opts, {flipAt:0});
      return cardHTML(c, opts).replace('class="card', 'class="card flip').replace(/^<div ([^>]*)>/, (m0, attrs)=>`<div ${attrs}><span class="flipback">${BACK_SVG}</span>`).replace(' new"', '"').replace(' new ', ' ');
    }
  }
  return `<div class="${cls}" data-card="${c}" role="img" aria-label="${label}"><img class="face-img" src="cards/${c}.png" alt="" draggable="false" decoding="sync"></div>`;
}

/* ---------- 카지노 칩 ---------- */
const CHIPS = [
  {v:5000, c:'#8c1d40', e:'#f3d27a', t:'5K'},
  {v:1000, c:'#e0a12a', e:'#3a2a0a', t:'1K'},
  {v:500,  c:'#6a3d9a', e:'#f4efe4', t:'500'},
  {v:100,  c:'#1d1f22', e:'#f4efe4', t:'100'},
  {v:25,   c:'#1f8a4c', e:'#f4efe4', t:'25'},
  {v:5,    c:'#c62f2f', e:'#f4efe4', t:'5'},
  {v:1,    c:'#f2efe6', e:'#2d5fa8', t:'1'},
];
// 시작 칩 구성 (이 개수로 테이블에 앉음)
const START_STACKS = {
  1000:  [[100,4],[25,16],[5,40]],              // $400 + $400 + $200
  10000: [[1000,4],[500,6],[100,20],[25,40]],    // $4,000 + $3,000 + $2,000 + $1,000
};
function chipParts(amount){
  const out = []; let left = Math.max(0, Math.round(amount));
  for (const ch of CHIPS){ const n = Math.floor(left / ch.v); if (n){ out.push([ch, n]); left -= n*ch.v; } }
  return out;
}
function chipOne(ch, i){ return `<i class="chip" style="--c:${ch.c};--e:${ch.e}${i!=null?`;--i:${i}`:''}"><b>${ch.t}</b></i>`; }
// 금액을 칩 더미로 표시 (칩 종류별로 기둥, 기둥마다 최대 maxPer개)
function chipStack(amount, {cols=3, maxPer=6}={}){
  const parts = chipParts(amount).slice(0, cols);
  if (!parts.length) return '';
  return `<span class="stack">${parts.map(([ch,n])=>{
    const k = Math.min(n, maxPer);
    return `<span class="col" style="--n:${k}">${Array.from({length:k},(_,i)=>chipOne(ch, i)).join('')}</span>`;
  }).join('')}</span>`;
}
function chipBreakdown(amount, startTotal){
  const start = START_STACKS[startTotal] || START_STACKS[10000];
  const kinds = start.map(([v])=>v);                     // 이 테이블에서 쓰는 칩 종류 (큰 것부터)
  let left = Math.max(0, Math.round(amount)); const cnt = {};
  // 작은 칩부터 시작할 때 받은 개수만큼 채우고
  for (const [v, n] of [...start].reverse()){ const k = Math.min(n, Math.floor(left / v)); if (k){ cnt[v] = k; left -= k*v; } }
  // 나머지는 큰 칩으로
  for (const v of kinds){ const k = Math.floor(left / v); if (k){ cnt[v] = (cnt[v]||0) + k; left -= k*v; } }
  // 더 작은 단위가 남으면 $5, $1 칩으로
  for (const v of [5, 1]){ const k = Math.floor(left / v); if (k){ cnt[v] = (cnt[v]||0) + k; left -= k*v; } }
  return CHIPS.filter(ch=>cnt[ch.v]).map(ch=>[ch, cnt[ch.v]]);
}
// 내 칩을 실제처럼 기억: 낼 때는 가진 칩으로(필요하면 거슬러 받고), 딸 때는 받은 만큼 위에 쌓음
const TRAY_KINDS = [5000, 1000, 500, 100, 25, 5, 1];
function addChips(cnt, amt){ for (const v of TRAY_KINDS){ const k = Math.floor(amt / v); if (k){ cnt[v] = (cnt[v]||0) + k; amt -= k*v; } } }
function payChips(cnt, amt){
  for (const v of TRAY_KINDS){ while ((cnt[v]||0) > 0 && v <= amt){ cnt[v]--; amt -= v; } }
  while (amt > 0){                                    // 딱 맞는 칩이 없으면 큰 칩 하나를 깨서 거스름돈
    const v = [...TRAY_KINDS].reverse().find(x => (cnt[x]||0) > 0 && x > amt);
    if (!v) return false;
    cnt[v]--; addChips(cnt, v - amt); amt = 0;
  }
  return true;
}
function trayParts(id, amount, startTotal){
  ui.trays = ui.trays || {};
  let t = ui.trays[id];
  if (!t || t.amt === 0){                         // 처음이거나 리바이: 시작 칩 구성으로
    t = {amt: amount, cnt: {}};
    chipBreakdown(amount, startTotal).forEach(([ch, n])=>{ t.cnt[ch.v] = n; });
  } else if (amount > t.amt) addChips(t.cnt, amount - t.amt);
  else if (amount < t.amt && !payChips(t.cnt, t.amt - amount)){ t.cnt = {}; chipBreakdown(amount, startTotal).forEach(([ch, n])=>{ t.cnt[ch.v] = n; }); }
  t.amt = amount; ui.trays[id] = t;
  return CHIPS.filter(ch => t.cnt[ch.v] > 0).map(ch => [ch, t.cnt[ch.v]]);
}
function chipTray(amount, startTotal, id){
  const parts = id ? trayParts(id, amount, startTotal) : chipBreakdown(amount, startTotal);
  if (!parts.length) return '<span class="note">칩 없음</span>';
  return parts.map(([ch, n])=>{
    const k = Math.min(n, 10);
    return `<span class="tcol" title="${fmt(ch.v)} × ${n}"><span class="stack"><span class="col" style="--n:${k}">${Array.from({length:k},(_,i)=>chipOne(ch, i)).join('')}</span></span><span class="count num">×${n}</span></span>`;
  }).join('');
}
function startStackHTML(total){
  const parts = START_STACKS[total] || [];
  return parts.map(([v,n])=>{ const ch = CHIPS.find(x=>x.v===v); return `<span class="startchip">${chipOne(ch)}<span>×${n}</span></span>`; }).join('');
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=localizedText(msg); t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true, 2600); }

function myId(){ return view==='local' ? 'me' : me.pid; }
function nameOf(s, i){
  const p = s.seats[i]; if (!p) return '';
  if (p.id===myId()) return language==='en'?'Me':language==='zh'?'我':'나';
  return p.name || (language==='en'?`Player ${i+1}`:language==='zh'?`玩家 ${i+1}`:`플레이어 ${i+1}`);
}
function logName(s, e){
  const p = s.seats[e.i];
  if (p && p.id===e.id) return nameOf(s, e.i);
  return e.n || '';
}

/* ---------- 테이블 ---------- */
// 자리 위치(테이블 너비·높이 %): 내 자리(0)를 맨 아래 가운데에 두고 시계 방향.
// 세로 화면: 맨 아래 줄은 나만(양옆에 이모티콘·내 칩), 다른 사람은 위쪽 줄과 양옆에 앉음
const SEAT_LAYOUT = {
  2: [[50,90],[50,11]],
  3: [[50,90],[25,11],[75,11]],
  4: [[50,90],[11,50],[50,11],[89,50]],
  5: [[50,90],[11,50],[30,11],[70,11],[89,50]],
  6: [[50,90],[11,50],[18,11],[50,11],[82,11],[89,50]],
  7: [[50,90],[10,62],[10,38],[30,11],[70,11],[90,38],[90,62]],
  8: [[50,90],[10,62],[10,38],[18,11],[50,11],[82,11],[90,38],[90,62]],
  9: [[50,90],[10,62],[10,38],[14,11],[38,11],[62,11],[86,11],[90,38],[90,62]],
};
// 가로 화면(PC·태블릿): 2:1 타원 테두리를 따라 고르게
function wideSlot(k, N){
  if (k===0) return [50, 90];
  if (N===2) return [50, 10];
  // 내 자리 양옆(이모티콘·칩 자리)은 비워 두고 나머지 둘레에 고르게
  const gap = Math.max(60, 180 - (N-1)*30), a = (90 + gap + (k-1)*(360 - 2*gap)/(N-2)) * Math.PI/180;

function placeBets(){
  const table = app.querySelector('.table'); if (!table) return;
  const bets = [...table.querySelectorAll('.betchip')]; if (!bets.length) return;
  const T = table.getBoundingClientRect(), R = e => e.getBoundingClientRect();
  const hit = (a, c) => a.left < c.right-1 && c.left < a.right-1 && a.top < c.bottom-1 && c.top < a.bottom-1;
  const blockers = [...table.querySelectorAll('.center .board, .center .pot, .center .stage, .seat, .emostrip, .mytray')].map(R);
  const placed = [];
  const place = (el, tight) => {
    const x = +el.dataset.x, y = +el.dataset.y, side = x < 50 ? 1 : -1;
    el.classList.toggle('tight', !!tight);
    const b0 = R(el), w = b0.width, h = b0.height;               // 칩 더미 크기는 한 번만 재고
    const rectAt = (bx, by) => { const cx = T.left + bx/100*T.width, cy = T.top + by/100*T.height; return {left:cx-w/2, right:cx+w/2, top:cy-h/2, bottom:cy+h/2}; };
    const cands = [];
    for (let f = .5; f >= .14; f -= .04) cands.push([x + (50-x)*f, y + (50-y)*f]);   // 가운데 쪽으로
    for (let dx = 8; dx <= 26; dx += 3) for (const dy of [0, -6, 6, -11, 11, -16, 16, -21, 21]) cands.push([x + side*dx, y + dy]);  // 자리 주변

  if (!a){
    const eq = opp ? equity(p.cards, s.board, opp, 500) : 1;
    a = {eq, opp, imp: improveInfo(p.cards, s.board), cat: best(p.cards.concat(s.board)).cat};
    adviceCache.set(key, a); if (adviceCache.size > 40) adviceCache.delete(adviceCache.keys().next().value);
  }
  const pot = potSize(s), call = L.callAmt, need = call > 0 ? call / (pot + call) : 0;
  const pct = x => (x*100 >= 10 ? Math.round(x*100) : (x*100).toFixed(1)) + '%';
  const draw = a.imp && a.imp.p >= .3;
  const bbAmt = s.bb || BB, round = v => Math.max(bbAmt, Math.round(v / 10) * 10);
  let act, why, tone;
  if (L.canCheck){
    if (a.eq >= .65){ act = `베팅 ${fmt(round(pot*.6))}`; tone='bet'; why = `이길 확률이 ${pct(a.eq)}로 높아요. 팟의 절반~¾ 정도 베팅해서 칩을 더 받아내세요.`; }
    else if (a.eq >= .48){ act = `작게 베팅 ${fmt(round(pot*.35))}`; tone='bet'; why = `괜찮은 패예요(이길 확률 ${pct(a.eq)}). 팟의 ⅓ 정도로 작게 베팅하거나 체크해도 좋아요.`; }
    else if (draw){ act = '체크'; tone='check'; why = `지금은 약하지만 ${s.board.length===3?'리버까지':'다음 카드에서'} 족보가 좋아질 확률이 ${pct(a.imp.p)}예요. 공짜로 다음 카드를 보세요.`; }
    else { act = '체크'; tone='check'; why = `아직 약한 패예요(이길 확률 ${pct(a.eq)}). 공짜면 체크하고, 상대가 크게 베팅하면 접는 게 좋아요.`; }
  } else {
    if (a.eq >= .7 && L.canRaise){ act = '레이즈'; tone='bet'; why = `이길 확률 ${pct(a.eq)}로 아주 강해요. 레이즈해서 팟을 키우세요.`; }
    else if (a.eq >= need + .05){ act = `콜 ${fmt(call)}`; tone='call'; why = `이길 확률 ${pct(a.eq)}가 콜에 필요한 승률 ${pct(need)}보다 높아서, 길게 보면 이득이에요.`; }
    else if (draw && s.board.length < 5 && a.eq >= need - .04){ act = `콜 ${fmt(call)}`; tone='call'; why = `지금 승률(${pct(a.eq)})은 필요한 만큼(${pct(need)})에 조금 못 미치지만, 좋아질 확률이 ${pct(a.imp.p)}라 콜해볼 만해요.`; }
    else { act = '폴드'; tone='fold'; why = `이길 확률 ${pct(a.eq)}로는 ${fmt(call)}을 내기엔 손해예요(필요한 승률 ${pct(need)}). 접고 다음 판을 노리세요.`; }
  }
  return {...a, act, why, tone, need, call, pct};
}
function adviceHTML(s, mi){
  const p = s.seats[mi];
  if (!s.board.length || !BETTING.has(s.stage) || !p.inHand || p.folded || p.allin) return '';
  const street = {3:'플랍', 4:'턴', 5:'리버'}[s.board.length];
  const head = `<button class="adv-toggle${ui.adviceOpen?' on':''}" data-a="advice" aria-expanded="${!!ui.adviceOpen}"><span class="emo-t">💡</span> 추천플레이 <span class="adv-street">${street}</span><span class="adv-caret">${ui.adviceOpen?'▴':'▾'}</span></button>`;
  if (!ui.adviceOpen) return `<div class="advice">${head}</div>`;
  const a = adviceFor(s, mi);
  const mine = s.toAct === mi;
  const eqW = Math.round(a.eq*100), needL = Math.round(a.need*100);
  const outs = a.imp && a.imp.outs.length ? `<div class="adv-row"><span>다음 카드 한 장으로 될 수 있는 족보</span><b>${a.imp.outs.slice(0,3).map(([k,n])=>`${HAND[k]==='스트레이트 플러시' ? '스트레이트 플러시' : HAND[k]} ${n}장`).join(' · ')}</b> <span class="adv-sub">(남은 ${a.imp.nextCards}장 중)</span></div>` : '';
  const imp = a.imp ? `<div class="adv-row"><span>${s.board.length===3 ? '리버까지 족보가 좋아질 확률' : '리버에서 족보가 좋아질 확률'}</span><b>${a.pct(a.imp.p)}</b></div>` : '';
  return `<div class="advice open">${head}
    <div class="adv-body">
      <div class="adv-rec ${a.tone}"><span class="adv-label">${mine ? '추천' : '내 차례가 오면'}</span><b>${a.act}</b></div>
      <p class="adv-why">${a.why}</p>
      <div class="adv-bar" aria-label="이길 확률 ${eqW}%"><i style="width:${eqW}%"></i>${a.call>0 ? `<em style="left:${needL}%" title="필요한 승률"></em>` : ''}</div>
      <div class="adv-legend"><span>이길 확률 <b>${a.pct(a.eq)}</b> (상대 ${a.opp}명)</span>${a.call>0 ? `<span><em></em>콜에 필요한 승률 <b>${a.pct(a.need)}</b></span>` : ''}</div>
      ${imp}${outs}
      <p class="adv-note">상대 패를 모른다고 보고 계산한 참고용 확률이에요.</p>
    </div></div>`;
}

// 판이 끝난 뒤 전원 카드·족보 비교표
function resultHTML(s, mi){
  if (s.stage!=='done') return '';
  const won = {}; (s.winners||[]).forEach(w=>{ won[w.s] = (won[w.s]||0) + w.amt; });
  const rows = [];
  s.seats.forEach((p,i)=>{ if (p && p.inHand && (p.shown || i===mi) && p.cards && p.cards.length===2 && p.cards[0]!=='back') rows.push({i, p, w: won[i]||0}); });
  if (rows.length<2) return '';
  const rank = r => r.w ? 0 : r.p.folded ? 2 : 1;
  rows.sort((a,b)=> rank(a)-rank(b) || b.w-a.w || (b.p.sc||0)-(a.p.sc||0));
  const winHands = new Set(rows.filter(r=>r.w).map(r=>r.i));
  const body = rows.map(r=>{
    const res = r.w ? `<b class="res-win num">+${fmt(r.w)}</b>` : r.p.folded ? `<span class="res-fold">폴드</span>` : `<span class="res-lose">패배</span>`;
    const u = !r.p.folded && s.board.length>=3 ? handUse(r.p.cards, s.board) : null;
    const hn = r.p.hn ? esc(r.p.hn) + (u && u.shared ? ' <small class="res-board">바닥</small>' : '') : '';
    return `<tr class="${r.w?'w':''}${r.p.folded?' f':''}${r.i===mi?' me':''}"><td class="res-nm"><span data-nm="${r.i}"></span>${r.i===mi?' <small>(나)</small>':''}</td><td class="res-cards">${r.p.cards.map(c=>cardHTML(c,{mini:true, dim:r.p.folded})).join('')}</td><td class="res-hn">${hn}</td><td class="res-out">${res}</td></tr>`;
  }).join('');
  const note = s.uncontested ? '<p class="res-note">모두 폴드해서 끝난 판이에요. 스스로 공개한 카드만 보여요.</p>' : '';
  return `<div class="result"><div class="res-title">이번 핸드 결과</div><table class="res-table"><thead><tr><th>플레이어</th><th>카드</th><th>족보</th><th>결과</th></tr></thead><tbody>${body}</tbody></table>${note}</div>`;
}
function renderDock(s, mi, now){
  if (mi<0){
    const full = s.seats.every(Boolean);
    return `<div class="dock"><p class="status">${full ? '자리가 다 찼어요. 관전 중이에요.' : '빈 자리를 눌러 앉으면 다음 핸드부터 참여해요.'}</p></div>`;
  }
  const p = s.seats[mi];
  const inPlay = p.inHand && !p.folded;
  const b = inPlay && s.board.length>=3 ? best(p.cards.concat(s.board)) : null;
  const use = b ? handUse(p.cards, s.board) : null;
  let handTxt = '';
  if (p.inHand && p.cards.length){
    if (b) handTxt = handName(b);
    else if (p.cards[0][0]===p.cards[1][0]) handTxt = '포켓 페어';
    else handTxt = p.cards[0][1]===p.cards[1][1] ? '수딧' : '오프수트';
    if (p.folded) handTxt = '폴드함';
  }
  const holes = p.inHand && p.cards.length ? p.cards.map(c=>cardHTML(c,{animate:true,key:s.handNo+'m', dim:p.folded})).join('') : cardHTML(null)+cardHTML(null);
  const mine = `<div class="mine"><div class="hole">${holes}</div><div class="info"><span class="hand">${use && use.shared ? '<em class="hand-board">바닥</em>' : ''}${esc(handTxt || (s.stage==='idle'?'대기 중':'이번 핸드 관전'))}${HAND_INFO[handTxt] ? `<button class="info-btn${ui.infoOpen?' on':''}" data-a="info" aria-label="${handTxt} 뜻 보기" aria-expanded="${!!ui.infoOpen}">i</button>` : ''}</span>${handUseHTML(use)}${p.inHand && !p.folded ? handRankHTML(handTxt) : ''}<span class="sub">칩 <b class="num">${fmt(p.chips)}</b>${p.bet?` · 이번 라운드 베팅 <span class="num">${fmt(p.bet)}</span>`:''}</span></div></div>`;

  let controls = '';
  if (BETTING.has(s.stage) && s.toAct===mi){
    const L = legal(s, mi);
    const key = `${s.handNo}-${s.stage}-${s.currentBet}-${p.bet}`;
    if (ui.raiseKey!==key){ ui.raiseKey=key; ui.raiseOpen=false; ui.raiseTo=L.minTo; ui.raiseWheelDelta=0; }
    ui.raiseTo = Math.max(L.minTo, Math.min(ui.raiseTo, L.maxTo));
    const callTxt = L.canCheck ? '체크' : (L.callAmt>=p.chips ? `올인 ${fmt(L.callAmt)}` : `콜 ${fmt(L.callAmt)}`);
    controls = `<div class="actions">
      <button class="act fold" data-a="fold">폴드</button>
      <button class="act call" data-a="${L.canCheck?'check':'call'}">${callTxt}</button>
      <button class="act raise" data-a="raise-open" ${L.canRaise?'':'disabled'}>${s.currentBet===0?'베팅':'레이즈'}</button>
    </div>`;
    if (ui.raiseOpen && L.canRaise){
      const potNow = potSize(s);
      const half = s.currentBet + Math.round((potNow+L.callAmt)/2/10)*10;
      const full = s.currentBet + Math.round((potNow+L.callAmt)/10)*10;
      controls += `<div class="raisebox">
        <div class="raise-amount"><label for="raise-amount">금액</label><input id="raise-amount" type="number" inputmode="numeric" min="${L.minTo}" max="${L.maxTo}" step="1" value="${ui.raiseTo}" aria-label="베팅 또는 레이즈 금액"></div>
        <input id="raise-range" type="range" min="0" max="1000" step="1" value="${L.maxTo===L.minTo?0:Math.round((ui.raiseTo-L.minTo)/(L.maxTo-L.minTo)*1000)}" data-min="${L.minTo}" data-max="${L.maxTo}" aria-label="베팅 또는 레이즈 금액 조절">

          <button data-a="preset" data-v="${full}">팟</button>

  } else if (BETTING.has(s.stage)){

    const over = view==='local' && localGameOver(s);

    else controls = `<p class="status">다음 핸드 <span data-count="${s.nextHandAt}"></span></p>`;
    if (p.inHand && p.cards && p.cards.length===2 && !p.shown) controls += `<button class="ghost" data-a="show-cards">내 카드 보여주기</button>`;
  } else if (s.stage==='idle'){
    const ready = idxs(s, q=>!q.sitOut && !q.away && q.chips>0).length;
    controls = view==='online'
      ? (ready>=2 ? `<button class="primary" data-a="start-online">지금 시작 (${ready}명)</button>${s.autoAt?`<p class="status">자동 시작 <span data-count="${s.autoAt}"></span></p>`:''}` : `<p class="status">2명 이상 앉으면 시작할 수 있어요. 친구에게 초대 링크를 보내주세요.</p>`)

        <button class="primary" type="submit">저장</button></form>`;

  return `<div class="dock">${pop}${resultHTML(s, mi)}${mine}${adviceHTML(s, mi)}${controls}${extra}${inviteBox(s)}</div>`;
}

function localGameOver(s){
  const mine = s.seats[0];
  const botsLeft = idxs(s,(p,i)=>i>0 && p.chips>0).length;
  if (mine.chips===0) return `<div class="over"><h3>칩을 모두 잃었어요</h3><p class="note">${s.handNo}핸드를 버텼어요.</p><button class="primary" data-a="start-local">새 게임</button></div>`;
  if (botsLeft===0) return `<div class="over"><h3>우승!</h3><p class="note">${s.handNo}핸드 만에 모든 칩을 가져왔어요.</p><button class="primary" data-a="start-local">새 게임</button></div>`;
  return '';
}

function tickTimers(){
  const now = Date.now();
  app.querySelectorAll('[data-deadline]').forEach(el=>{ const left = Math.max(0, +el.dataset.deadline - now); el.style.width = (left/TURN_MS*100)+'%'; });
  app.querySelectorAll('[data-count]').forEach(el=>{ const left = Math.max(0, Math.ceil((+el.dataset.count - now)/1000)); el.textContent = `${left}초`; });
}

/* ================= 온라인 모드 =================
   방장 기기가 딜러. 메시지는 공개 MQTT 중계 서버를 거치고,
   플레이어마다 따로 만든 키(ECDH P-256 → AES-GCM)로 암호화해서
   중계 서버나 다른 사람은 카드·채팅 내용을 볼 수 없음. */
const BROKERS = window.HOLDEM_BROKERS || ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
const TOPIC_ROOT = 'yky-holdem/v1/';
const net = {mq:null, role:null, room:'', broker:0, hostPub:'', keys:null, key:null, myPub:'', peers:new Map(), state:null, hostState:null, tick:null, helloTimer:null, failT:null, status:'', hostStatus:'', gotState:false, token:null, sendQ:Promise.resolve(), chat:[], lastChat:{}};
const roomTopic = () => TOPIC_ROOT + net.room;

/* ---------- 아주 작은 MQTT 3.1.1 클라이언트 (WebSocket, QoS 0) ---------- */
const te = new TextEncoder(), td = new TextDecoder();
function mqStr(str){ const b = typeof str==='string' ? te.encode(str) : str; const o = new Uint8Array(2+b.length); o[0]=b.length>>8; o[1]=b.length&255; o.set(b,2); return o; }
function mqCat(...parts){ let n=0; parts.forEach(x=>n+=x.length); const o=new Uint8Array(n); let k=0; parts.forEach(x=>{ o.set(x,k); k+=x.length; }); return o; }
function mqPacket(type, body){ const len=[]; let n=body.length; do { let d=n%128; n=Math.floor(n/128); if (n>0) d|=128; len.push(d); } while(n>0); return mqCat(Uint8Array.of(type, ...len), body); }
// 방장은 모든 중계 서버에 동시에 접속 → 하나가 죽어도 게임 유지
class MultiMQ {
  constructor(list){ this.list = list; }
  get connected(){ return this.list.some(m=>m.connected); }
  firstUp(){ const i = this.list.findIndex(m=>m.connected); return i<0 ? 0 : i; }
  publish(t, s, r){ this.list.forEach(m=>{ if (m.connected) m.publish(t, s, r); }); }
  subscribe(t){ this.list.forEach(m=>m.subscribe(t)); }
  kick(){ this.list.forEach(m=>m.kick()); }
  end(){ this.list.forEach(m=>m.end()); }
}
class MiniMQTT {
  constructor(url, o){ this.url=url; this.o=o; this.subs=new Set(); this.queue=[]; this.connected=false; this.ended=false; this.buf=new Uint8Array(0); this.retry=0; this.open(); }
  open(){
    if (this.ended) return;
    let ws; try { ws = new WebSocket(this.url, ['mqtt']); } catch(_){ this.schedule(); return; }
    this.ws = ws; ws.binaryType = 'arraybuffer'; this.buf = new Uint8Array(0);
    ws.onopen = ()=>{ try { ws.send(this.pkConnect()); } catch(_){} };
    ws.onmessage = e=>{ if (this.ws===ws) this.feed(new Uint8Array(e.data)); };
    ws.onclose = ws.onerror = ()=>{
      if (this.ws!==ws) return; this.ws = null;
      const was = this.connected; this.connected = false; clearInterval(this.ping);
      if (was && this.o.onDown) this.o.onDown();
      this.schedule();
    };
  }
  schedule(){ if (this.ended) return; clearTimeout(this.rt); const d = Math.min(6000, 600*Math.pow(1.6, this.retry++)); this.rt = setTimeout(()=>this.open(), d); }
  kick(){ if (this.ended) return; if (this.connected){ this.raw(Uint8Array.of(0xC0,0)); return; } clearTimeout(this.rt); this.retry=0; if (this.ws){ const w=this.ws; this.ws=null; try{ w.close(); }catch(_){} } this.open(); }
  pkConnect(){
    let flags = 0x02; const pay = [mqStr(this.o.clientId)];
    if (this.o.will){ flags |= 0x04 | (this.o.will.retain ? 0x20 : 0); pay.push(mqStr(this.o.will.topic), mqStr(this.o.will.payload)); }
    return mqPacket(0x10, mqCat(mqStr('MQTT'), Uint8Array.of(4, flags, 0, 30), ...pay));
  }
  feed(chunk){
    this.buf = mqCat(this.buf, chunk);
    for(;;){
      const b = this.buf; if (b.length < 2) return;
      let len=0, mul=1, i=1, byte;
      do { if (i >= b.length) return; byte = b[i++]; len += (byte & 127)*mul; mul *= 128; } while (byte & 128);
      if (b.length < i+len) return;
      const head = b[0], body = b.slice(i, i+len); this.buf = b.slice(i+len);
      this.handle(head, body);
    }
  }
  handle(head, body){
    const type = head >> 4;
    if (type===2){                                   // CONNACK
      if (body[1]!==0){ try{ this.ws.close(); }catch(_){} return; }
      this.connected = true; this.retry = 0;
      if (this.subs.size) this.raw(this.pkSub([...this.subs]));
      const q = this.queue; this.queue = []; q.forEach(pk=>this.raw(pk));
      clearInterval(this.ping); this.ping = setInterval(()=>this.raw(Uint8Array.of(0xC0,0)), 20000);
      if (this.o.onConnect) this.o.onConnect();
    } else if (type===3){                            // PUBLISH
      const qos = (head>>1)&3, tl = (body[0]<<8)|body[1];
      const topic = td.decode(body.slice(2, 2+tl)), off = 2+tl+(qos?2:0);
      if (this.o.onMessage) this.o.onMessage(topic, td.decode(body.slice(off)));
    }
  }
  pkSub(topics){ const id = 1+randInt(65000); return mqPacket(0x82, mqCat(Uint8Array.of(id>>8, id&255), ...topics.map(t=>mqCat(mqStr(t), Uint8Array.of(0))))); }
  raw(pk){ try { if (this.ws && this.ws.readyState===1) this.ws.send(pk); } catch(_){} }
  subscribe(t){ this.subs.add(t); if (this.connected) this.raw(this.pkSub([t])); }
  publish(topic, str, retain){
    const pk = mqPacket(0x30 | (retain?1:0), mqCat(mqStr(topic), te.encode(str)));
    if (this.connected) this.raw(pk); else { this.queue.push(pk); if (this.queue.length>100) this.queue.shift(); }
  }
  end(){ this.ended = true; clearTimeout(this.rt); clearInterval(this.ping); this.raw(Uint8Array.of(0xE0,0)); const w=this.ws; this.ws=null; this.connected=false; setTimeout(()=>{ try{ w && w.close(); }catch(_){} }, 50); }
}

/* ---------- 암호화 ---------- */
const b64u = buf => { let s=''; new Uint8Array(buf).forEach(c=>s+=String.fromCharCode(c)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const ub64u = str => { const s = String(str).replace(/-/g,'+').replace(/_/g,'/'); return Uint8Array.from(atob(s + '==='.slice((s.length+3)%4)), c=>c.charCodeAt(0)); };
const EC = {name:'ECDH', namedCurve:'P-256'};
async function newKeys(){ const k = await crypto.subtle.generateKey(EC, true, ['deriveKey']); return {privateKey:k.privateKey, pub: b64u(await crypto.subtle.exportKey('raw', k.publicKey))}; }
async function guestKeys(){
  const saved = tabStore('holdem.gk');
  if (saved){ try { const j = JSON.parse(saved); return {privateKey: await crypto.subtle.importKey('jwk', j.priv, EC, true, ['deriveKey']), pub:j.pub}; } catch(_){} }
  const k = await crypto.subtle.generateKey(EC, true, ['deriveKey']);
  const pub = b64u(await crypto.subtle.exportKey('raw', k.publicKey));
  tabStore('holdem.gk', JSON.stringify({priv: await crypto.subtle.exportKey('jwk', k.privateKey), pub}));
  return {privateKey:k.privateKey, pub};
}
async function deriveKey(priv, pubStr){
  const pub = await crypto.subtle.importKey('raw', ub64u(pubStr), EC, false, []);
  return crypto.subtle.deriveKey({name:'ECDH', public:pub}, priv, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function sealBox(key, obj){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, te.encode(JSON.stringify(obj))); return b64u(iv)+'.'+b64u(ct); }
async function openBox(key, box){ const [a,b] = String(box).split('.'); const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:ub64u(a)}, key, ub64u(b)); return JSON.parse(td.decode(pt)); }
function genId(n){ const A='abcdefghijkmnpqrstuvwxyz23456789'; let c=''; for (let i=0;i<n;i++) c+=A[randInt(A.length)]; return c; }
const onlineSupported = () => !!(window.WebSocket && window.crypto && crypto.subtle);

const EMOJIS = ['😀','😆','🤣','🤪','😜','😡','🤬','🤯','😵\u200d💫','😴','🤑','💩','👺','☠️','🤲','👏','🤝','👍','👎','✌️','👌','🖐️','🫵','🖕','🔥','🎰','💸','🚬','🪓','🔪','💣','📈','📉','‼️','⁉️','♣️','♥️','♦️','♠️','🃏'];

function cleanChat(t){ return String(t||'').replace(/[\u0000-\u001f]/g,' ').replace(/\s+/g,' ').trim().slice(0,200); }
// 방장만 실행: 메시지를 받아 모두에게 전달

function receiveChat(m){

function roomFromURL(){
  try {
